name: Build (rootless)

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Theos
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: theos-macos-rootless-v1

      - name: Prepare Theos
        uses: Randomblock1/theos-action@v1.5

      - name: Pick SDK
        id: sdk
        run: |
          set -eux
          ls -la "$THEOS/sdks" || true
          SDK=""
          for cand in 16.5 16.2 16.1 16.0 15.6 15.5 15.0 14.5 14.4; do
            if [ -d "$THEOS/sdks/iPhoneOS${cand}.sdk" ]; then
              SDK="$cand"
              break
            fi
          done
          if [ -z "$SDK" ]; then
            SDK=$(ls -d "$THEOS/sdks"/iPhoneOS*.sdk 2>/dev/null | sed 's/.*iPhoneOS//;s/.sdk//' | sort -V | tail -1)
          fi
          echo "Using SDK ${SDK}"
          echo "sdk=${SDK}" >> "$GITHUB_OUTPUT"

      - name: Build EvilKit framework first
        run: |
          set -eux
          make -C EvilKit clean || true
          make -C EvilKit all FINALPACKAGE=1 \
            TARGET="iphone:clang:${{ steps.sdk.outputs.sdk }}:15.0" \
            ARCHS="arm64"
          # Theos stages the linked binary at .theos/obj/<arch>/ but the
          # staged wrapper lacks Headers, so assemble a framework bundle
          # for the -F search path manually: headers from src, binary staged.
          FW_BIN="$(ls EvilKit/.theos/obj/*/EvilKit.framework/EvilKit | head -1)"
          test -f "$FW_BIN"
          mkdir -p EvilKit/EvilKit.framework/Headers
          cp EvilKit/src/*.h EvilKit/EvilKit.framework/Headers/
          cp "$FW_BIN" EvilKit/EvilKit.framework/EvilKit
          test -f EvilKit/EvilKit.framework/Headers/EvilKit.h

      - name: Build package
        run: |
          set -eux
          echo "THEOS=$THEOS"
          make package FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=rootless \
            THEOS_PLATFORM_DEB_COMPRESSION_TYPE=gzip \
            TARGET="iphone:clang:${{ steps.sdk.outputs.sdk }}:15.0" \
            ARCHS="arm64"
          ls -la packages/

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: evilscheme-rootless-deb
          path: packages/*.deb
          if-no-files-found: error
