name: Build (rootless)

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Theos
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: theos-macos-rootless-v1

      - name: Prepare Theos
        uses: Randomblock1/theos-action@v1.5

      - name: Pick SDK
        id: sdk
        run: |
          set -eux
          ls -la "$THEOS/sdks" || true
          SDK=""
          for cand in 16.5 16.2 16.1 16.0 15.6 15.5 15.0 14.5 14.4; do
            if [ -d "$THEOS/sdks/iPhoneOS${cand}.sdk" ]; then
              SDK="$cand"
              break
            fi
          done
          if [ -z "$SDK" ]; then
            SDK=$(ls -d "$THEOS/sdks"/iPhoneOS*.sdk 2>/dev/null | sed 's/.*iPhoneOS//;s/.sdk//' | sort -V | tail -1)
          fi
          echo "Using SDK ${SDK}"
          echo "sdk=${SDK}" >> "$GITHUB_OUTPUT"

      - name: Build EvilKit framework first
        run: |
          set -ux
          set -o pipefail
          make -C EvilKit clean || true
          make -C EvilKit all FINALPACKAGE=1 \
            TARGET="iphone:clang:${{ steps.sdk.outputs.sdk }}:15.0" \
            ARCHS="arm64 arm64e" 2>&1 | tee /tmp/evilkit.log
          # Theos stages the linked binary at .theos/obj/<arch>/ but the
          # staged wrapper lacks Headers, so assemble a framework bundle
          # for the -F search path manually: headers from src, binary staged.
          FW_BIN="$(ls EvilKit/.theos/obj/*/EvilKit.framework/EvilKit | head -1)"
          test -f "$FW_BIN"
          mkdir -p EvilKit/EvilKit.framework/Headers
          cp EvilKit/src/*.h EvilKit/EvilKit.framework/Headers/
          cp "$FW_BIN" EvilKit/EvilKit.framework/EvilKit
          test -f EvilKit/EvilKit.framework/Headers/EvilKit.h

      - name: Build package
        run: |
          set -ux
          set -o pipefail
          echo "THEOS=$THEOS"
          make package FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=rootless \
            THEOS_PLATFORM_DEB_COMPRESSION_TYPE=gzip \
            TARGET="iphone:clang:${{ steps.sdk.outputs.sdk }}:15.0" \
            ARCHS="arm64 arm64e" 2>&1 | tee /tmp/build.log
          ls -la packages/

      - name: Verify arm64e slices (needed for iPhone XS)
        run: |
          find .theos EvilKit -type f \( -name ZZ_EvilScheme.dylib -o -name EvilSchemePrefs -o -name EvilKit \) -print -exec lipo -info {} \;
          find .theos -type f \( -name ZZ_EvilScheme.dylib -o -name EvilKit \) -print -exec lipo -info {} \; | grep -q arm64e

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: evilscheme-rootless-deb
          path: packages/*.deb
          if-no-files-found: error

      # Self-service failure logs: push full build output to the ci-logs
      # branch so it can be fetched without API tokens (public repo).
      # Branch push does not retrigger this workflow (master/main only).
      - name: Publish failure logs to ci-logs branch
        if: failure()
        run: |
          git config user.name "CI"
          git config user.email "ci@users.noreply.github.com"
          mkdir -p ci-logs
          cp /tmp/evilkit.log ci-logs/ 2>/dev/null || echo "no evilkit log" > ci-logs/evilkit.log
          cp /tmp/build.log ci-logs/ 2>/dev/null || echo "no build log" > ci-logs/build.log
          echo "${{ github.sha }}" > ci-logs/sha.txt
          git add -f ci-logs/
          git commit -m "CI logs for ${{ github.sha }}" || true
          git push --force origin HEAD:ci-logs
