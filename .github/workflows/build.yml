name: Build (rootless)

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install make xz ldid

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$(brew --prefix)/opt/make/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Build EvilKit framework first
        run: |
          make -C EvilKit all FINALPACKAGE=1
          # Theos stages the linked binary at .theos/obj/<arch>/ but the
          # staged wrapper lacks Headers, so assemble a framework bundle
          # for the -F search path manually: headers from src, binary staged.
          FW_BIN="$(ls EvilKit/.theos/obj/*/EvilKit.framework/EvilKit | head -1)"
          test -f "$FW_BIN"
          mkdir -p EvilKit/EvilKit.framework/Headers
          cp EvilKit/src/*.h EvilKit/EvilKit.framework/Headers/
          cp "$FW_BIN" EvilKit/EvilKit.framework/EvilKit
          test -f EvilKit/EvilKit.framework/Headers/EvilKit.h

      - name: Build package
        run: |
          echo "THEOS=$THEOS"
          make package FINALPACKAGE=1

      - name: Show debs
        run: ls -la packages/

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: evilscheme-rootless-deb
          path: packages/*.deb
          if-no-files-found: error
